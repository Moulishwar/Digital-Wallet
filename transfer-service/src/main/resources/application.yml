server:
  port: 8083

spring:
  application:
    name: transfer-service

  # No defaults for credentials. A missing variable must fail startup loudly rather than
  # silently fall back to something insecure.
  datasource:
    url: ${TRANSFER_DB_URL}
    username: ${TRANSFER_DB_USER}
    password: ${TRANSFER_DB_PASSWORD}
    hikari:
      pool-name: transfer-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. validate fails startup if the entities and migrations disagree,
      # which turns a silent production drift into a build-time error.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys only, fetched from auth-service and cached. Verification then happens
          # locally on every request, so auth-service being down does not stop this service from
          # honouring tokens it already issued.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

security:
  jwt:
    # Tokens are only accepted from this issuer. Without the check, a token signed by any key the
    # JWKS happens to serve would be accepted regardless of who minted it.
    expected-issuer: ${AUTH_JWT_ISSUER:https://digitalwallet.example/auth}

  # Presented to wallet-service on /internal/** calls. No default.
  service-credential: ${SERVICE_CREDENTIAL}

wallet:
  base-url: ${WALLET_SERVICE_URL:http://localhost:8082}
  # A transfer holds a request thread while it waits. These are deliberately short: a slow
  # wallet-service should turn into a NEEDS_RECONCILIATION the sweep will settle, not into a
  # request that hangs until the client gives up knowing nothing.
  connect-timeout: 2s
  read-timeout: 5s

auth:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 3s

transfers:
  # Ceiling on a single transfer. Not a regulatory limit but a blast radius. There are no per-day
  # or velocity limits.
  max-amount-minor: 10000000
  reconciliation:
    # How often the sweep looks for transfers whose outcome is still unknown, and how long a
    # transfer must have been stuck before it is picked up: long enough that an in-flight request
    # is not mistaken for an abandoned one.
    interval: 30s
    min-age: 10s
    batch-size: 50
  idempotency:
    # How long a duplicate request waits for the original to finish. Comfortably longer than the
    # wallet read timeout above, so a retry fired at a slow-but-succeeding request still gets the
    # real answer rather than being told to come back later.
    max-wait: 8s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Filled in from the root pom at build time; must match the swagger-ui webjar on the classpath.
    version: '@swagger-ui.version@'
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.digitalwallet: INFO
