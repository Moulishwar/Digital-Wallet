name: CI

# Build and test on every push and pull request; publish images only from a green main.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency scanning on a schedule as well as per-change: a dependency you have not touched
    # can become vulnerable overnight, and only a clock notices that.
    - cron: "0 6 * * 1"

# Cancel a superseded run rather than paying for a build whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ledger's integration tests assert on timestamps, and PostgreSQL rejects the legacy zone
  # alias Windows reports for IST. Pinning UTC keeps the build identical everywhere.
  TZ: UTC

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon. GitHub-hosted Ubuntu runners have one already, so
      # there is nothing to install — the integration tests run against a real PostgreSQL 16 here
      # exactly as they do locally, which is the point of using Testcontainers rather than H2.
      - name: Build, unit test and integration test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  security-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The NVD database is large and its API rate-limits anonymous callers hard. Caching it keeps
      # the scan to seconds on all but the first run.
      #
      # Restore and save are split rather than using actions/cache, which only saves when the job
      # succeeds. This scan fails precisely when it finds something, and a failing scan that threw
      # away a two-hour download would pay that cost again on every run until the build went green.
      - name: Restore the NVD database
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Scan dependencies
        env:
          # Optional. Without it the scan still runs, just far more slowly.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity-scan verify -DskipTests

      - name: Save the NVD database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests
        run: npm test
      # Type-checks the app, its tests and the end-to-end suite, then bundles.
      - run: npm run build

  e2e:
    name: End-to-end (desktop, iPhone, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build the service images
        run: |
          ./mvnw -B -DskipTests install -pl platform-common -am
          ./mvnw -B -DskipTests spring-boot:build-image \
            -pl auth-service,wallet-service,transfer-service,api-gateway

      # A fresh set of secrets for this run alone.
      - name: Write a throwaway environment
        run: deploy/make-env.sh

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f web/e2e/compose.e2e.yml --profile services up -d --build --wait

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies and browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run the end-to-end tests
        working-directory: web
        run: npm run e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

      - name: Service logs
        if: failure()
        run: docker compose --profile services logs --no-color --timestamps > compose-logs.txt

      - name: Upload the service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 14

  publish-images:
    name: Publish images (${{ matrix.arch }})
    # Only from main, and only once every test and the scan have passed. An image that was never
    # proven green is worse than no image, because it looks trustworthy.
    needs: [build, security-scan, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Published for Intel and ARM servers alike. Each architecture is built natively on its own
    # runner; emulating ARM on an Intel runner would make the build several times slower.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The services by Cloud Native Buildpacks via the Spring Boot plugin (no Dockerfile to drift
      # out of step with the build); the web app from its two-stage Dockerfile.
      - name: Build and push this architecture's images
        run: |
          set -euo pipefail
          # GHCR namespaces are lowercase; a repository owner with capitals would otherwise
          # produce an image name the registry rejects.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${OWNER}"
          TAG="${GITHUB_SHA}-${{ matrix.arch }}"

          # The services depend on platform-common, which -pl leaves out of the reactor, and this
          # runner's Maven repository is empty. Install it (and the parent pom) first. Not -am on
          # the build below: that would run build-image on platform-common too, which is a library
          # with no main class.
          ./mvnw -B -DskipTests install -pl platform-common -am
          ./mvnw -B -DskipTests spring-boot:build-image \
            -pl auth-service,wallet-service,transfer-service,api-gateway \
            -Dimage.registry="${REGISTRY}" \
            -Dimage.tag="${TAG}"

          # Labelled with its source repository, so the registry links it there and it takes the
          # repository's public visibility.
          docker build web --tag "${REGISTRY}/web:${TAG}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"

          for IMAGE in auth-service wallet-service transfer-service api-gateway web; do
            docker push "${REGISTRY}/${IMAGE}:${TAG}"
          done

  publish-manifests:
    name: Publish multi-architecture images
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One name per image covering both architectures; a server pulls the one that matches it.
      # Tagged twice on purpose: `latest` is convenient, and the commit SHA is what lets you say
      # precisely which code is running somewhere.
      - name: Join the two architectures under one tag
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/${OWNER}"
          for IMAGE in auth-service wallet-service transfer-service api-gateway web; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE}:${GITHUB_SHA}" \
              --tag "${REGISTRY}/${IMAGE}:latest" \
              "${REGISTRY}/${IMAGE}:${GITHUB_SHA}-amd64" \
              "${REGISTRY}/${IMAGE}:${GITHUB_SHA}-arm64"
          done
