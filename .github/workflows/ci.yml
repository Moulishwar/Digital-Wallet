name: CI

# Build and test on every push and pull request; publish images only from a green main.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency scanning on a schedule as well as per-change: a dependency you have not touched
    # can become vulnerable overnight, and only a clock notices that.
    - cron: "0 6 * * 1"

# Cancel a superseded run rather than paying for a build whose result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ledger's integration tests assert on timestamps, and PostgreSQL rejects the legacy zone
  # alias Windows reports for IST. Pinning UTC keeps the build identical everywhere.
  TZ: UTC

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon. GitHub-hosted Ubuntu runners have one already, so
      # there is nothing to install — the integration tests run against a real PostgreSQL 16 here
      # exactly as they do locally, which is the point of using Testcontainers rather than H2.
      - name: Build, unit test and integration test
        run: ./mvnw -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  security-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The NVD database is large and its API rate-limits anonymous callers hard. Caching it keeps
      # the scan to seconds on all but the first run.
      - name: Cache the NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Scan dependencies
        env:
          # Optional. Without it the scan still runs, just far more slowly.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Psecurity-scan verify -DskipTests

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 30

  publish-images:
    name: Publish images
    # Only from main, and only once the tests and the scan have both passed. An image that was
    # never proven green is worse than no image, because it looks trustworthy.
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cloud Native Buildpacks via the Spring Boot plugin — there is no Dockerfile in this
      # repository to drift out of step with the build.
      #
      # Tagged twice on purpose: `latest` is convenient, and the commit SHA is what lets you say
      # precisely which code is running somewhere.
      - name: Build and publish images
        run: |
          set -euo pipefail
          # GHCR namespaces are lowercase; a repository owner with capitals would otherwise
          # produce an image name the registry rejects.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA_TAG=$(git rev-parse --short HEAD)
          REGISTRY="ghcr.io/${OWNER}"

          # Built once, locally, tagged with the commit SHA. Tagging `latest` is then a rename of
          # the same bytes rather than a second build — which is both faster and stronger: the two
          # tags are guaranteed to be the identical image, not two builds that ought to match.
          ./mvnw -B -DskipTests spring-boot:build-image \
            -pl auth-service,wallet-service,transfer-service,api-gateway \
            -Dimage.registry="${REGISTRY}" \
            -Dimage.tag="${SHA_TAG}"

          for SERVICE in auth-service wallet-service transfer-service api-gateway; do
            docker tag "${REGISTRY}/${SERVICE}:${SHA_TAG}" "${REGISTRY}/${SERVICE}:latest"
            docker push "${REGISTRY}/${SERVICE}:${SHA_TAG}"
            docker push "${REGISTRY}/${SERVICE}:latest"
          done
