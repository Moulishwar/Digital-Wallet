# Serves the app, and forwards /api to the gateway so the browser only ever talks to one origin.
# That single origin is what lets the refresh token live in a SameSite=Strict, httpOnly cookie.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 64k;

    # In production a TLS proxy (Caddy) sits in front, so every connection here comes from it.
    # Believe the visitor's address it reports, but only from private container networks: nothing
    # on the internet can reach this server except through that proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Headers for every response this server writes itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        # Set, never appended to: whatever a visitor sends in these headers is replaced, so the
        # gateway's rate limit is keyed by the address nginx actually saw.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # For uptime monitoring: up only if the gateway behind this server is up.
    location = /healthz {
        proxy_pass http://api-gateway:8080/actuator/health;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Content-hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Always revalidated, so a new deploy reaches people at once.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Present only in demo mode. Never answered with the app's page in its place, so its absence
    # reads as "not a demo".
    location = /demo.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app itself. The policy allows only this origin's own scripts, styles, fonts and API.
    # 'unsafe-inline' for styles only, because the dialog library positions itself with inline
    # style attributes; scripts get no such allowance. data: images are the stamp's ink texture.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
